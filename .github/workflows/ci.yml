name: CI/CD Pipeline

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/sergeyvetyutnev/mini-study-crud

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run Maven tests
        run: ./mvnw -B clean test

  docker-image:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
            ${{ env.IMAGE_NAME }}:master

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: docker-image

    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    steps:
      - name: Chekout Repository
        uses: actions/checkout@v4

      - name: Copy docker-compose to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "docker-compose.prod.yaml"
          target: "/opt/mini-study-crud/"

      - name: Deploy to VPS via SSH Action
        uses: appleboy/ssh-action@v1.0.3
        env:
          COMMIT_SHA: sha-${{ github.sha }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: COMMIT_SHA
          script: |
            cd /opt/mini-study-crud
            echo "IMAGE_TAG=$COMMIT_SHA" > .env
            docker compose pull app
            docker compose up -d
            
            docker compose -f docker-compose.prod.yml pull app
            docker compose -f docker-compose.prod.yml up -d

      - name: Health check
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          echo "Waiting for Spring Boot to start..."
          sleep 15
          curl --fail --retry 10 --retry-delay 5 http://$VPS_HOST:8080/swagger-ui/index.html