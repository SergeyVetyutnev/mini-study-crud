apiVersion: apps/v1
kind: Deployment
metadata:
  name: mini-study-crud-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spring-boot
  template:
    metadata:
      labels:
        app: spring-boot
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: java-app
          image: ghcr.io/sergeyvetyutnev/mini-study-crud:APP_VERSION
          ports:
            - containerPort: 8080
          env:
            - name: spring.datasource.url
              value: "jdbc:postgresql://postgres-db:5432/mini_crud_db"
            - name: spring.data.redis.host
              value: "redis"
            - name: REDIS_HOST
              value: "redis"
            - name: APP_RATE_LIMITER_REDIS_URL
              value: "redis://redis:6379"
---
apiVersion: v1
kind: Service
metadata:
  name: spring-boot-service
spec:
  selector:
    app: spring-boot
  ports:
    - port: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app-ingress
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: spring-boot-service
                port:
                  number: 8080