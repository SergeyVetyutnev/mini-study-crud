spring:
  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/mini_crud_db
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate
  liquibase:
    change-log: classpath:db/changelog/changelog-master.yaml
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      password: ${REDIS_PASSWORD:redis_pass}
      timeout: 500ms
      connect-timeout: 200ms
app:
  rate-limiter:
    redis:
      url: redis://:${REDIS_PASSWORD:redis_pass}@${REDIS_HOST:localhost}:6379
      expiration-duration: 10s
