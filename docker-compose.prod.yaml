
services:
  app:
    image: ghcr.io/sergeyvetyutnev/mini-study-crud:${IMAGE_TAG}
    container_name: my-prod-app
    ports:
      - "8080:8080"
    environment:
      - spring.datasource.url=jdbc:postgresql://postgres-db:5432/mini_crud_db
      - spring.data.redis.host=redis
      - REDIS_HOST=redis
      - APP_RATE_LIMITER_REDIS_URL=redis://redis:6379
    depends_on:
      - postgres-db
      - redis
    restart: unless-stopped

  postgres-db:
    image: postgres:16-alpine
    container_name: my-prod-db
    environment:
      POSTGRES_DB: mini_crud_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: my-prod-redis
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: my-prod-prometheus
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: my-prod-grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  pgdata: